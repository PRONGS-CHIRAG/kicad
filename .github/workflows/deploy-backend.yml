# Deploys the FastAPI + kicad-cli backend to Fly.io from the GitHub web UI.
#
# Fly has no dashboard deploy for a Dockerfile app, so this workflow is the
# browser path: Actions -> "Deploy backend to Fly" -> Run workflow.
#
# Deliberately NOT triggered on push. A redeploy restarts the single machine,
# and every in-flight team run and open session lives in that machine's RAM, so
# deploying has to be something you choose, not something a merge does to you.
name: Deploy backend to Fly

on:
  workflow_dispatch:
    inputs:
      org:
        description: "Fly organization slug (dashboard -> org dropdown)"
        required: true
        default: "personal"

concurrency: deploy-backend

jobs:
  deploy:
    name: Build image and deploy one machine
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create the app if this is the first run
        run: |
          set -euo pipefail
          app=$(grep -m1 '^app *=' fly.toml | cut -d'"' -f2)
          echo "app name from fly.toml: $app"
          # `apps list --quiet` prints bare app names, one per line. Probing with
          # `fly status` instead would be wrong: it can also fail on an app that
          # exists but has no Machines yet, which is exactly the state a retried
          # first run leaves behind.
          if flyctl apps list --quiet | grep -qx "$app"; then
            echo "App already exists — skipping creation."
          else
            # No `|| true` here on purpose: Fly app names are globally unique,
            # so a failure most likely means the name is taken. Fix it by
            # editing the `app =` line in fly.toml, not by ignoring this.
            flyctl apps create "$app" --org "${{ inputs.org }}"
          fi

      - name: Deploy
        # --remote-only builds on Fly's builder. The image installs KiCAD from
        # apt, so the first build takes roughly 8-15 minutes.
        run: flyctl deploy --remote-only

      - name: Show what is running
        run: flyctl status
