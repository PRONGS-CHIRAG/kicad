# Brings up the whole MVP with a real kicad-cli, which is what makes the ERC/DRC
# verification meaningful. `docker compose up --build` then open localhost:3000.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      KICAD_MITOS_WORKSPACE: /workspace
      KICAD_MITOS_PROJECTS_DIR: /app/fixtures/projects
      KICAD_MITOS_CORS_ORIGINS: '["http://localhost:3000"]'
      KICAD_MITOS_EXECUTOR: ${KICAD_MITOS_EXECUTOR:-local}
      # Set to enable LLM planning; the rule planner is used either way on failure.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      # Uploaded projects and checkpoints survive a container restart.
      - workspace:/workspace
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  workspace:
